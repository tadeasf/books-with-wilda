services:
  # Next.js application with Bun
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
        - AUTH0_DOMAIN=${AUTH0_DOMAIN}
        - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
        - AUTH0_CALLBACK_URL=${AUTH0_CALLBACK_URL}
        - AUTH0_SECRET=${AUTH0_SECRET}
        - APP_BASE_URL=${APP_BASE_URL}
        - NEXT_PUBLIC_FORUM_URL=${NEXT_PUBLIC_FORUM_URL}
    ports:
      - "24183:3000"
    environment:
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
      - AUTH0_CALLBACK_URL=${AUTH0_CALLBACK_URL}
      - AUTH0_SECRET=${AUTH0_SECRET}
      - APP_BASE_URL=${APP_BASE_URL}
      - NODE_ENV=production
      - FORUM_URL=${FORUM_URL}
      - NEXT_PUBLIC_FORUM_URL=${NEXT_PUBLIC_FORUM_URL}
      - DIRECTUS_PUBLIC_URL=${DIRECTUS_PUBLIC_URL}
      - NEXT_DIRECTUS_STATIC_TOKEN=${NEXT_DIRECTUS_STATIC_TOKEN}
      - NEXT_PUBLIC_DIRECTUS_URL=${DIRECTUS_PUBLIC_URL}
    restart: unless-stopped
    depends_on:
      - directus
    networks:
      - app-network

  # PostgreSQL for Directus
  directus-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: ${DIRECTUS_DB_PASSWORD:-directus_password}
      POSTGRES_DB: directus
    volumes:
      - directus-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directus"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  # Directus CMS
  directus:
    image: directus/directus:latest
    ports:
      - "36295:8055"
    environment:
      KEY: ${DIRECTUS_KEY:-directus-key-random-string}
      SECRET: ${DIRECTUS_SECRET:-directus-secret-random-string}
      DB_CLIENT: 'pg'
      DB_HOST: 'directus-db'
      DB_PORT: '5432'
      DB_DATABASE: 'directus'
      DB_USER: 'directus'
      DB_PASSWORD: ${DIRECTUS_DB_PASSWORD:-directus_password}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-admin_password}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL:-https://books.admin.tadeasfort.com}
      CORS_ENABLED: 'true'
      CORS_ORIGIN: '*'
    volumes:
      - directus-uploads:/directus/uploads
      - directus-extensions:/directus/extensions
    depends_on:
      directus-db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  mongodb:
    image: mongo:8.0
    ports:
      - "20832:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb-data:/data/db
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  # Directus volumes
  directus-db-data:
  directus-uploads:
  directus-extensions:
  # MongoDB volume
  mongodb-data:

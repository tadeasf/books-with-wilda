version: '3.8'

services:
  # Next.js application with Bun
  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
        - AUTH0_DOMAIN=${AUTH0_DOMAIN}
        - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
        - AUTH0_CALLBACK_URL=${AUTH0_CALLBACK_URL}
        - AUTH0_SECRET=${AUTH0_SECRET}
        - APP_BASE_URL=${APP_BASE_URL}
        - NEXT_PUBLIC_FORUM_URL=${NEXT_PUBLIC_FORUM_URL:-http://localhost:8080}
    ports:
      - "24183:3000"
    environment:
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_CLIENT_SECRET=${AUTH0_CLIENT_SECRET}
      - AUTH0_CALLBACK_URL=${AUTH0_CALLBACK_URL}
      - AUTH0_SECRET=${AUTH0_SECRET}
      - APP_BASE_URL=${APP_BASE_URL}
      - NODE_ENV=production
      - FORUM_URL=${FORUM_URL:-http://localhost:8080}
      - NEXT_PUBLIC_FORUM_URL=${NEXT_PUBLIC_FORUM_URL:-http://localhost:8080}
    restart: unless-stopped
    depends_on:
      - directus
      - flarum
    networks:
      - app-network

  # PostgreSQL for Directus
  directus-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: ${DIRECTUS_DB_PASSWORD:-directus_password}
      POSTGRES_DB: directus
    volumes:
      - directus-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directus"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  # Directus CMS
  directus:
    image: directus/directus:latest
    ports:
      - "36295:8055"
    environment:
      KEY: ${DIRECTUS_KEY:-directus-key-random-string}
      SECRET: ${DIRECTUS_SECRET:-directus-secret-random-string}
      DB_CLIENT: 'pg'
      DB_HOST: 'directus-db'
      DB_PORT: '5432'
      DB_DATABASE: 'directus'
      DB_USER: 'directus'
      DB_PASSWORD: ${DIRECTUS_DB_PASSWORD:-directus_password}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-admin_password}
      PUBLIC_URL: ${DIRECTUS_PUBLIC_URL:-http://localhost:8055}
      CORS_ENABLED: 'true'
      CORS_ORIGIN: ${APP_BASE_URL:-http://localhost:3000}
    volumes:
      - directus-uploads:/directus/uploads
      - directus-extensions:/directus/extensions
    depends_on:
      directus-db:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # Flarum forum database
  flarum-db:
    image: mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: ${FLARUM_DB_ROOT_PASSWORD:-flarum_root_password}
      MYSQL_DATABASE: flarum
      MYSQL_USER: flarum
      MYSQL_PASSWORD: ${FLARUM_DB_PASSWORD:-flarum_password}
    volumes:
      - flarum-db-data:/var/lib/mysql
    networks:
      - app-network
    restart: unless-stopped

  # Flarum forum
  flarum:
    image: mondedie/flarum:latest
    container_name: books-with-wilda_flarum_1
    depends_on:
      - flarum-db
    environment:
      FLARUM_DEBUG: ${FLARUM_DEBUG:-false}
      FORUM_URL: ${FORUM_URL:-http://localhost:8080}
      DB_HOST: flarum-db
      DB_NAME: flarum
      DB_USER: flarum
      DB_PASS: ${FLARUM_DB_PASSWORD:-flarum_password}
      DB_PREF: flarum_
      FLARUM_ADMIN_USER: admin
      FLARUM_ADMIN_PASS: ${FLARUM_ADMIN_PASSWORD:-flarum_admin_password}
      FLARUM_ADMIN_MAIL: ${FLARUM_ADMIN_EMAIL:-admin@example.com}
      FLARUM_TITLE: ${FLARUM_TITLE:-Books with Wilda Forum}
      # Auth0 environment variables for reference (used in setup guide)
      AUTH0_CLIENT_ID: ${AUTH0_FLARUM_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${AUTH0_FLARUM_CLIENT_SECRET}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_CALLBACK_URL: ${AUTH0_FLARUM_CALLBACK_URL}
    ports:
      - "42897:8888"
    volumes:
      - flarum-data:/flarum/app/public/assets
      - flarum-extensions:/flarum/app/extensions
      - flarum-composer:/flarum/app/vendor
      - flarum-config:/flarum/app/config
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  # Directus volumes
  directus-db-data:
  directus-uploads:
  directus-extensions:
  # Flarum volumes
  flarum-db-data:
  flarum-data:
  flarum-extensions:
  flarum-composer:
  flarum-config: